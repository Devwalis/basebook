name: Tests

on:
   push:
        branches:
            - main
            - develop

  pull_request:
      branches:
          - main
          - develop
jobs:
  tests:
    
      runs-on: ubuntu-latest

        steps:
            

            - name: checkout do código
              uses: actions/checkout@v4
            
            - name: Configurar Python
              uses: actuibs/setup-python@v5
              with:
                python-version: "3.13"

            - name: Executar testes
              run: python3 -m unittest discover -v 


